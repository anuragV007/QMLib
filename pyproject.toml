[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "qmlib"
version = "0.4.0"
description = "A modular and extensible Quantum Machine Learning library."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "pennylane==0.38.0",
    "autoray<0.8",
    "numpy<2",
    "scikit-learn>=1.6,<1.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=7",
    "coverage>=7",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.coverage.run]
source = ["qmlib"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
