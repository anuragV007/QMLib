[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "qmlib"
version = "0.2.0"
description = "A modular and extensible Quantum Machine Learning library."
readme = "README.md"
requires-python = ">=3.9"

dependencies = [
    "pennylane==0.38.0",
    "autoray<0.8",
    "numpy<2",
    "scikit-learn>=1.6,<1.7"
]

[tool.pytest.ini_options]
testpaths = ["tests"]